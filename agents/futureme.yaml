# Docker Agent definition for the Milestone 1 spike.
# Run from the repo root:  docker agent run agents/futureme.yaml
# Requires NEBIUS_API_KEY in the environment. Set `model` to an id from `npm run spike:models`.
version: "2"

models:
  nemotron:
    provider: openai
    model: nvidia/Llama-3_3-Nemotron-Super-49B-v1_5
    base_url: https://api.tokenfactory.nebius.com/v1/
    token_key: NEBIUS_API_KEY

agents:
  root:
    model: nemotron
    description: FutureMe, the user's future self.
    instruction: |
      You are the user's future self, ten years ahead. Speak in the first person, warmly and honestly.
      Before answering, call search_memory for anything the user has told you before.
      When the user states a goal, value, or commitment, save it with write_note.
    toolsets:
      - type: mcp
        command: npx
        args: ["tsx", "mcp/vault-server.ts"]
